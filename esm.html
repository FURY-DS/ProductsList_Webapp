<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ESM</title>
<link rel="stylesheet" href="css/base.css?v=33" />
<link rel="stylesheet" href="css/card-features.css?v=33" />
</head>
<body>

<header class="topbar">
  <div class="menu-wrapper">
    <button type="button" id="btn-menu" class="btn-menu" title="메뉴 열기">메뉴</button>
    <nav class="dropdown" id="menu-dropdown" aria-label="주 메뉴">
      <!-- 메뉴 항목은 js/menu.js에서 동적 생성 -->
    </nav>
  </div>
  <div class="title">ESM</div>
  <div class="search-bar" id="search-bar">
    <button class="btn btn-toggle-all" id="btn-toggle-all" data-action="collapse" title="모든 카드 상세 정보 숨기기">전체 숨기기</button>
    <span class="icon">🔍</span>
    <input type="text" id="search-input" autocomplete="off" />
    <button class="clear" id="search-clear" title="검색어 지우기">×</button>
    <span class="count" id="search-count"></span>
  </div>
  <div class="bulk-fee-bar">
    <label>판매수수료 전체입력</label>
    <input type="number" id="bulk-fee-input" step="any" placeholder="0.1" />
    <button id="btn-bulk-fee">적용</button>
  </div>
  <div class="actions">
    <button id="btn-export" title="데이터 내보내기">내보내기</button>
    <button id="btn-import" title="데이터 가져오기">가져오기</button>
    <button id="btn-clear" title="전체 삭제">전체삭제</button>
  </div>
  <input type="file" id="import-input" accept="application/json" style="display:none" />
</header>

<main class="container">
  <div id="board" class="columns"></div>
</main>

<!-- 확인 모달 -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h3 id="modal-title">삭제 확인</h3>
    <p id="modal-text"></p>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="modal-cancel">취소</button>
      <button class="btn btn-confirm-danger" id="modal-confirm">삭제</button>
    </div>
  </div>
</div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<!-- 스크립트 (의존성 순서대로 로드) -->
<script src="js/config.js?v=33"></script>
<script src="js/esm-config.js?v=33"></script>
<script src="js/utils.js?v=33"></script>
<script src="js/shared-storage.js?v=33"></script>
<script src="js/shared-search.js?v=33"></script>
<script src="js/esm-state.js?v=33"></script>
<script src="js/toast.js"></script>
<script src="js/modal.js"></script>
<script src="js/esm-storage.js?v=33"></script>
<script src="js/esm-search.js?v=33"></script>
<script src="js/shared-card.js?v=33"></script>
<script src="js/esm-card.js?v=33"></script>
<script src="js/menu.js?v=33"></script>
<script src="js/esm-actions.js?v=33"></script>
<script src="js/auth.js?v=33"></script>
<script src="js/cloud-sync.js?v=33"></script>
<script src="js/esm-app.js?v=33"></script>

</body>
</html>
