<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>상품리스트</title>
<link rel="stylesheet" href="css/style.css?v=11" />
</head>
<body class="app-hidden">

<!-- 인증 오버레이 (로그인/회원가입) -->
<div id="auth-overlay" class="auth-overlay">
  <div class="auth-card">
    <div class="auth-logo">📋 상품리스트</div>
    <div class="auth-tabs">
      <button type="button" class="auth-tab active" data-mode="login">로그인</button>
      <button type="button" class="auth-tab" data-mode="register">회원가입</button>
    </div>
    <form id="auth-form">
      <div class="auth-field">
        <label for="auth-username">아이디</label>
        <input type="text" id="auth-username" placeholder="3~20자 영문/숫자" autocomplete="username" />
      </div>
      <div class="auth-field">
        <label for="auth-password">비밀번호</label>
        <input type="password" id="auth-password" placeholder="6자 이상" autocomplete="current-password" />
      </div>
      <div class="auth-field hidden" id="auth-confirm-field">
        <label for="auth-password-confirm">비밀번호 확인</label>
        <input type="password" id="auth-password-confirm" placeholder="비밀번호 재입력" autocomplete="new-password" />
      </div>
      <div class="auth-options" id="auth-options">
        <label class="auth-checkbox">
          <input type="checkbox" id="auth-save-pw" />
          <span>비밀번호 저장</span>
        </label>
        <label class="auth-checkbox">
          <input type="checkbox" id="auth-auto-login" />
          <span>자동로그인</span>
        </label>
      </div>
      <p class="auth-error" id="auth-error"></p>
      <button type="submit" class="btn-auth-submit" id="auth-submit">로그인</button>
    </form>
    <p class="auth-hint">첫 방문이면 회원가입을 먼저 해주세요.<br />각 사용자의 상품리스트가 독립적으로 관리됩니다.</p>
  </div>
</div>

<header class="topbar">
  <div class="menu-wrapper">
    <button id="btn-menu" class="btn-menu" title="메뉴 열기">메뉴</button>
    <nav class="dropdown" id="menu-dropdown" aria-label="주 메뉴">
      <!-- 메뉴 항목은 js/menu.js에서 동적 생성 -->
    </nav>
  </div>
  <div class="title">상품리스트</div>
  <div class="search-bar" id="search-bar">
    <button class="btn btn-toggle-all" id="btn-toggle-all" data-action="collapse" title="모든 카드 상세 정보 숨기기">전체 숨기기</button>
    <button
      class="btn btn-rate-bulk"
      id="btn-rate-bulk"
      title="모든 카드의 환율을 한 번에 수정"
      style="background-color:#0d9488 !important; color:#ffffff !important; border:1px solid #064e3b !important; padding:4px 8px !important; margin:0 2px !important; border-radius:6px !important; font-weight:600 !important; font-size:11px !important; display:inline-block !important; visibility:visible !important; opacity:1 !important; cursor:pointer !important; box-shadow:0 1px 3px rgba(13,148,136,0.3) !important;"
    >💱 환율 일괄수정</button>
    <button
      class="btn btn-percent-bulk"
      id="btn-percent-bulk"
      title="모든 카드의 퍼센트를 한 번에 수정"
      style="background-color:#6366f1 !important; color:#ffffff !important; border:1px solid #4338ca !important; padding:4px 8px !important; margin:0 2px !important; border-radius:6px !important; font-weight:600 !important; font-size:11px !important; display:inline-block !important; visibility:visible !important; opacity:1 !important; cursor:pointer !important; box-shadow:0 1px 3px rgba(99,102,241,0.3) !important;"
    >📊 퍼센트 일괄수정</button>
    <span class="icon">🔍</span>
    <input type="text" id="search-input" autocomplete="off" />
    <button class="clear" id="search-clear" title="검색어 지우기">×</button>
    <span class="count" id="search-count"></span>
    <button class="btn btn-global" id="btn-export-all" title="전체 데이터 내보내기">전체내보내기</button>
    <button class="btn btn-global" id="btn-import-all" title="전체 데이터 가져오기">전체가져오기</button>
    <button class="btn btn-cloud-sync" id="btn-cloud-sync" title="수동 동기화">☁️</button>
  </div>
  <div class="actions">
    <button id="btn-export" title="데이터 내보내기">내보내기</button>
    <button id="btn-import" title="데이터 가져오기">가져오기</button>
    <button id="btn-csv-template" title="엑셀 템플릿 다운로드" class="btn-csv">엑셀 템플릿</button>
    <button id="btn-csv-import" title="엑셀 파일 가져오기" class="btn-csv">엑셀 가져오기</button>
    <button id="btn-clear" title="전체 삭제">전체삭제</button>
  </div>
  <div class="user-area" id="user-area">
    <a href="admin.html" id="admin-link" class="admin-link" style="display:none;" title="관리자 패널">🔧 관리</a>
    <span class="user-badge" id="user-badge"></span>
    <button class="btn-logout" id="btn-logout" title="로그아웃">로그아웃</button>
  </div>
  <input type="file" id="import-input" accept="application/json" style="display:none" />
  <input type="file" id="import-all-input" accept="application/json" style="display:none" />
  <input type="file" id="csv-import-input" accept=".csv,text/csv" style="display:none" />
</header>

<main class="container">
  <div id="board" class="columns"></div>
</main>

<!-- 확인 모달 -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h3 id="modal-title">삭제 확인</h3>
    <p id="modal-text"></p>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="modal-cancel">취소</button>
      <button class="btn btn-confirm-danger" id="modal-confirm">삭제</button>
    </div>
  </div>
</div>

<!-- 환율 일괄 수정 모달 -->
<div class="modal-backdrop" id="rate-bulk-modal">
  <div class="modal modal-rate-bulk">
    <h3 id="rate-bulk-title">환율 일괄 수정</h3>
    <p class="modal-desc">모든 카드의 환율을 한 번에 수정할 수 있어요.</p>

    <div class="rate-bulk-section">
      <div class="rate-bulk-mode">
        <label class="rate-bulk-radio">
          <input type="radio" name="rate-mode" value="absolute" checked />
          <span>모든 환율을 같은 값으로 설정</span>
        </label>
        <label class="rate-bulk-radio">
          <input type="radio" name="rate-mode" value="multiplier" />
          <span>모든 환율에 같은 비율(배수) 적용</span>
        </label>
      </div>

      <div class="rate-bulk-input-wrap" id="rate-input-absolute">
        <label>새 환율 값 (₩)</label>
        <input type="number" id="rate-bulk-absolute" placeholder="예: 215" step="any" />
      </div>

      <div class="rate-bulk-input-wrap hidden" id="rate-input-multiplier">
        <label>곱할 비율 (1.0 = 그대로, 1.05 = 5% 인상)</label>
        <input type="number" id="rate-bulk-multiplier" placeholder="예: 1.05" step="any" />
      </div>

      <div class="rate-bulk-scope">
        <label>적용 범위</label>
        <select id="rate-bulk-scope">
          <option value="all">모든 카드</option>
          <option value="filled">환율이 입력된 카드만</option>
          <option value="empty">환율이 비어있는 카드만</option>
        </select>
      </div>

      <div class="rate-bulk-preview" id="rate-bulk-preview">
        <div class="preview-row"><span>변경 대상</span><strong id="preview-count">0개</strong></div>
        <div class="preview-row"><span>변경 전 평균</span><strong id="preview-before">-</strong></div>
        <div class="preview-row"><span>변경 후 평균</span><strong id="preview-after">-</strong></div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-cancel" id="rate-bulk-cancel">취소</button>
      <button class="btn btn-confirm" id="rate-bulk-apply">적용</button>
    </div>
  </div>
</div>

<!-- 퍼센트 일괄 수정 모달 -->
<div class="modal-backdrop" id="percent-bulk-modal">
  <div class="modal modal-rate-bulk">
    <h3 id="percent-bulk-title">퍼센트 일괄 수정</h3>
    <p class="modal-desc">모든 카드의 퍼센트를 한 번에 수정할 수 있어요.</p>

    <div class="rate-bulk-section">
      <div class="rate-bulk-mode">
        <label class="rate-bulk-radio">
          <input type="radio" name="pct-mode" value="absolute" checked />
          <span>모든 퍼센트를 같은 값으로 설정</span>
        </label>
        <label class="rate-bulk-radio">
          <input type="radio" name="pct-mode" value="multiplier" />
          <span>모든 퍼센트에 같은 비율(배수) 적용</span>
        </label>
      </div>

      <div class="rate-bulk-input-wrap" id="pct-input-absolute">
        <label>새 퍼센트 값 (예: 0.16)</label>
        <input type="number" id="percent-bulk-absolute" placeholder="예: 0.16" step="any" />
      </div>

      <div class="rate-bulk-input-wrap hidden" id="pct-input-multiplier">
        <label>곱할 비율 (1.0 = 그대로, 1.1 = 10% 인상)</label>
        <input type="number" id="percent-bulk-multiplier" placeholder="예: 1.1" step="any" />
      </div>

      <div class="rate-bulk-scope">
        <label>적용 범위</label>
        <select id="percent-bulk-scope">
          <option value="all">모든 카드</option>
          <option value="filled">퍼센트가 입력된 카드만</option>
          <option value="empty">퍼센트가 비어있는 카드만</option>
        </select>
      </div>

      <div class="rate-bulk-preview" id="percent-bulk-preview">
        <div class="preview-row"><span>변경 대상</span><strong id="pct-preview-count">0개</strong></div>
        <div class="preview-row"><span>변경 전 평균</span><strong id="pct-preview-before">-</strong></div>
        <div class="preview-row"><span>변경 후 평균</span><strong id="pct-preview-after">-</strong></div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-cancel" id="percent-bulk-cancel">취소</button>
      <button class="btn btn-confirm" id="percent-bulk-apply">적용</button>
    </div>
  </div>
</div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<!-- 스크립트 (의존성 순서대로 로드) -->
<script src="js/config.js?v=11"></script>
<script src="js/utils.js?v=11"></script>
<script src="js/state.js?v=11"></script>
<script src="js/toast.js?v=11"></script>
<script src="js/modal.js?v=11"></script>
<script src="js/storage.js?v=11"></script>
<script src="js/photo.js?v=11"></script>
<script src="js/search.js?v=11"></script>
<script src="js/card.js?v=11"></script>
<script src="js/menu.js?v=11"></script>
<script src="js/actions.js?v=11"></script>
<script src="js/rate-bulk.js?v=11"></script>
<script src="js/percent-bulk.js?v=11"></script>
<script src="js/auth.js?v=11"></script>
<script src="js/cloud-sync.js?v=11"></script>
<script src="js/app.js?v=11"></script>

</body>
</html>
