<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>상품리스트</title>
<link rel="stylesheet" href="css/style.css?v=4" />
</head>
<body>

<header class="topbar">
  <div class="menu-wrapper">
    <button id="btn-menu" class="btn-menu" title="메뉴 열기">메뉴</button>
    <nav class="dropdown" id="menu-dropdown" aria-label="주 메뉴">
      <!-- 메뉴 항목은 js/menu.js에서 동적 생성 -->
    </nav>
  </div>
  <div class="title">상품리스트</div>
  <div class="search-bar" id="search-bar">
    <button class="btn btn-toggle-all" id="btn-toggle-all" data-action="collapse" title="모든 카드 상세 정보 숨기기">전체 숨기기</button>
    <button
      class="btn btn-rate-bulk"
      id="btn-rate-bulk"
      title="모든 카드의 환율을 한 번에 수정"
      style="background-color:#0d9488 !important; color:#ffffff !important; border:2px solid #064e3b !important; padding:8px 16px !important; margin:0 4px !important; border-radius:8px !important; font-weight:700 !important; font-size:14px !important; display:inline-block !important; visibility:visible !important; opacity:1 !important; cursor:pointer !important; box-shadow:0 2px 6px rgba(13,148,136,0.4) !important;"
    >💱 환율 일괄수정 ✨</button>
    <span class="icon">🔍</span>
    <input type="text" id="search-input" autocomplete="off" />
    <button class="clear" id="search-clear" title="검색어 지우기">×</button>
    <span class="count" id="search-count"></span>
    <button class="btn btn-global" id="btn-export-all" title="전체 데이터 내보내기">전체내보내기</button>
    <button class="btn btn-global" id="btn-import-all" title="전체 데이터 가져오기">전체가져오기</button>
    <button class="btn btn-cloud-sync" id="btn-cloud-sync" title="클라우드 동기화 설정">☁️</button>
  </div>
  <div class="actions">
    <button id="btn-export" title="데이터 내보내기">내보내기</button>
    <button id="btn-import" title="데이터 가져오기">가져오기</button>
    <button id="btn-csv-template" title="엑셀 템플릿 다운로드" class="btn-csv">엑셀 템플릿</button>
    <button id="btn-csv-import" title="엑셀 파일 가져오기" class="btn-csv">엑셀 가져오기</button>
    <button id="btn-clear" title="전체 삭제">전체삭제</button>
  </div>
  <input type="file" id="import-input" accept="application/json" style="display:none" />
  <input type="file" id="import-all-input" accept="application/json" style="display:none" />
  <input type="file" id="csv-import-input" accept=".csv,text/csv" style="display:none" />
</header>

<main class="container">
  <div id="board" class="columns"></div>
</main>

<!-- 확인 모달 -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h3 id="modal-title">삭제 확인</h3>
    <p id="modal-text"></p>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="modal-cancel">취소</button>
      <button class="btn btn-confirm-danger" id="modal-confirm">삭제</button>
    </div>
  </div>
</div>

<!-- 환율 일괄 수정 모달 -->
<div class="modal-backdrop" id="rate-bulk-modal">
  <div class="modal modal-rate-bulk">
    <h3 id="rate-bulk-title">환율 일괄 수정</h3>
    <p class="modal-desc">모든 카드의 환율을 한 번에 수정할 수 있어요.</p>

    <div class="rate-bulk-section">
      <div class="rate-bulk-mode">
        <label class="rate-bulk-radio">
          <input type="radio" name="rate-mode" value="absolute" checked />
          <span>모든 환율을 같은 값으로 설정</span>
        </label>
        <label class="rate-bulk-radio">
          <input type="radio" name="rate-mode" value="multiplier" />
          <span>모든 환율에 같은 비율(배수) 적용</span>
        </label>
      </div>

      <div class="rate-bulk-input-wrap" id="rate-input-absolute">
        <label>새 환율 값 (₩)</label>
        <input type="number" id="rate-bulk-absolute" placeholder="예: 215" step="any" />
      </div>

      <div class="rate-bulk-input-wrap hidden" id="rate-input-multiplier">
        <label>곱할 비율 (1.0 = 그대로, 1.05 = 5% 인상)</label>
        <input type="number" id="rate-bulk-multiplier" placeholder="예: 1.05" step="any" />
      </div>

      <div class="rate-bulk-scope">
        <label>적용 범위</label>
        <select id="rate-bulk-scope">
          <option value="all">모든 카드</option>
          <option value="filled">환율이 입력된 카드만</option>
          <option value="empty">환율이 비어있는 카드만</option>
        </select>
      </div>

      <div class="rate-bulk-preview" id="rate-bulk-preview">
        <div class="preview-row"><span>변경 대상</span><strong id="preview-count">0개</strong></div>
        <div class="preview-row"><span>변경 전 평균</span><strong id="preview-before">-</strong></div>
        <div class="preview-row"><span>변경 후 평균</span><strong id="preview-after">-</strong></div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-cancel" id="rate-bulk-cancel">취소</button>
      <button class="btn btn-confirm" id="rate-bulk-apply">적용</button>
    </div>
  </div>
</div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<!-- 클라우드 동기화 모달 -->
<div class="modal-backdrop" id="cloud-sync-modal" style="display:none;">
  <div class="modal" style="max-width:460px;">
    <h3>☁️ 클라우드 동기화</h3>
    <p class="modal-desc">여러 기기에서 같은 데이터를 자동으로 공유합니다.</p>

    <div class="cloud-sync-status-bar">
      <span class="status-label">현재 상태:</span>
      <strong id="cloud-sync-status">확인 중...</strong>
    </div>

    <div class="cloud-sync-input-wrap">
      <label>API 키 (동기화 비밀번호)</label>
      <input type="password" id="cloud-api-key" placeholder="API 키를 입력하세요" autocomplete="off" />
      <p class="cloud-sync-hint">Cloudflare 대시보드에서 설정한 AUTH_KEY 값을 입력하세요.<br />키를 비우면 동기화가 꺼져요.</p>
    </div>

    <div class="modal-actions" style="flex-wrap:wrap; gap:8px;">
      <button class="btn btn-cancel" id="cloud-sync-close">닫기</button>
      <button class="btn btn-secondary" id="cloud-sync-manual">지금 동기화</button>
      <button class="btn btn-confirm" id="cloud-sync-save">저장</button>
    </div>
  </div>
</div>

<!-- 스크립트 (의존성 순서대로 로드) -->
<script src="js/config.js?v=5"></script>
<script src="js/utils.js?v=5"></script>
<script src="js/state.js?v=5"></script>
<script src="js/toast.js?v=5"></script>
<script src="js/modal.js?v=5"></script>
<script src="js/storage.js?v=5"></script>
<script src="js/photo.js?v=5"></script>
<script src="js/search.js?v=5"></script>
<script src="js/card.js?v=5"></script>
<script src="js/menu.js?v=5"></script>
<script src="js/actions.js?v=5"></script>
<script src="js/rate-bulk.js?v=5"></script>
<script src="js/cloud-sync.js?v=5"></script>
<script src="js/app.js?v=5"></script>

</body>
</html>
