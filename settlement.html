<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오픈마켓정산</title>
<link rel="stylesheet" href="css/base.css?v=33" />
<link rel="stylesheet" href="css/card-features.css?v=33" />
<link rel="stylesheet" href="css/settlement.css" />
<script>
  // alcave 전용 페이지 가드 - 다른 사용자는 즉시 리다이렉트
  (function () {
    var user = localStorage.getItem('auth_username') || sessionStorage.getItem('auth_username');
    if (user !== 'alcave') {
      alert('오픈마켓정산 페이지는 alcave만 이용할 수 있어요.');
      window.location.replace('index.html');
    }
  })();
</script>
</head>
<body>

<header class="topbar">
  <div class="menu-wrapper">
    <button type="button" id="btn-menu" class="btn-menu" title="메뉴 열기">메뉴</button>
    <nav class="dropdown" id="menu-dropdown" aria-label="주 메뉴">
      <!-- 메뉴 항목은 js/menu.js에서 동적 생성 -->
    </nav>
  </div>
  <div class="title">오픈마켓정산</div>
</header>

<main class="settlement-wrap">
  <div class="year-selector">
    <label>연도:</label>
    <select id="year-select">
      <option value="2024">2024</option>
      <option value="2025">2025</option>
      <option value="2026" selected>2026</option>
      <option value="2027">2027</option>
    </select>
  </div>

  <div class="settlement-btn-bar">
    <button id="btn-settlement-export" class="btn-export">내보내기</button>
    <button id="btn-settlement-import" class="btn-import">가져오기</button>
    <button id="btn-settlement-clear">전체 초기화</button>
  </div>

  <div class="settlement-scroll" id="settlement-scroll">
    <table class="settlement-table" id="settlement-table">
      <!-- settlement-render.js에서 동적 생성 -->
    </table>
  </div>

  <!-- 일별 이익 섹션 -->
  <div class="daily-section-toggle open" id="daily-toggle">
    <span class="toggle-arrow">▶</span>
    <span class="toggle-label">📦 엔와이 배송 - 일별 이익 (1~31일)</span>
  </div>

  <div class="daily-table-wrap settlement-scroll" id="daily-wrap">
    <table class="settlement-table" id="daily-table">
      <!-- settlement-render.js에서 동적 생성 -->
    </table>
  </div>
</main>

<!-- 확인 모달 -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <p id="modal-text"></p>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="modal-cancel">취소</button>
      <button class="btn btn-confirm-danger" id="modal-confirm">확인</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="js/config.js?v=33"></script>
<script src="js/settlement-config.js?v=33"></script>
<script src="js/settlement-state.js?v=33"></script>
<script src="js/settlement-storage.js?v=33"></script>
<script src="js/settlement-render.js?v=33"></script>
<script src="js/settlement-actions.js?v=33"></script>
<script src="js/utils.js?v=33"></script>
<script src="js/toast.js?v=33"></script>
<script src="js/modal.js?v=33"></script>
<script src="js/menu.js?v=33"></script>
<script src="js/auth.js?v=33"></script>
<script src="js/cloud-sync.js?v=33"></script>
<script src="js/settlement-app.js?v=33"></script>

<script>
  document.addEventListener('DOMContentLoaded', async () => {
    Auth.init();

    // 서버에서 세션/사용자 재확인 (네트워크 오류 시 저장된 세션으로 폴백)
    const isValid = await Auth.checkSession();
    if (!isValid) {
      window.location.replace('index.html');
      return;
    }
    if (Auth.username !== 'alcave') {
      alert('오픈마켓정산 페이지는 alcave만 이용할 수 있어요.');
      window.location.replace('index.html');
      return;
    }

    initMenu();
    await initSettlement();
  });
</script>
</body>
</html>
